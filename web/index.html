<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="BrisConnect+ helps Brisbane visitors and locals discover events, attractions, and experiences through a web-first smart city guide.">

  <!-- Google Sign-In web client ID. Authorized origins must include
       https://brisconnect-68b78.web.app in Google Cloud Console. -->
  <meta name="google-signin-client_id" content="2073694703-lm36h8lornphhn7vi2fdg67d93ullvnc.apps.googleusercontent.com">

  <!-- Open Graph / social sharing preview tags (static fallback) -->
  <!--
    NOTE: Facebook, Instagram and TikTok crawlers do not execute JavaScript.
    For dynamic per-content previews (e.g. a specific event or business),
    serve these tags from a server-side endpoint or Cloud Function that
    reads the path (e.g. /event/<id>, /business/<id>) and returns the
    matching title, description and image. The static tags below provide a
    fallback when no server-side renderer is in place.
  -->
  <meta property="og:site_name" content="BrisConnect+">
  <meta property="og:title" content="BrisConnect+ — Discover Brisbane">
  <meta property="og:description" content="Discover local food events, businesses and experiences in Brisbane with BrisConnect+">
  <meta property="og:image" content="https://brisconnect-68b78.web.app/assets/assets/brisconnect_icon.png">
  <meta property="og:url" content="https://brisconnect-68b78.web.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BrisConnect+">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="brisconnect_icon.svg"/>

  <title>BrisConnect+</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload Material Icons font so CanvasKit can draw icons immediately. -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>

  <!-- Explicit font-face for Material Icons to fix missing icons on web. -->
  <style>
    @font-face {
      font-family: 'MaterialIcons';
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
  </style>

  <!-- Google Maps JavaScript API — required for google_maps_flutter_web.
       Ensure the Maps JavaScript API is enabled in Google Cloud Console
       and that https://brisconnect-68b78.web.app is in the referrer list. -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD8zZ0I4E6cCJYZbdnP_P9CthyDqauLTak&loading=async"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background-color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    /* Safari-friendly fallback so legal links are always visible
       even if the Flutter canvas has layout/rendering issues. */
    #legal-fallback {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(8, 27, 75, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #legal-fallback a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    #legal-fallback a:hover,
    #legal-fallback a:active {
      background: rgba(255, 255, 255, 0.12);
    }

    #legal-fallback .separator {
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Always-visible legal links fallback for Safari and other browsers.
       This overlay sits above the Flutter canvas and links directly to
       the Flutter named routes handled by onGenerateRoute. -->
  <div id="legal-fallback" aria-label="Legal links">
    <a href="/privacy-policy">Privacy Policy</a>
    <span class="separator">•</span>
    <a href="/terms-of-service">Terms of Service</a>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
